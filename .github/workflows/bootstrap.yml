name: bootstrap

# One-time, manual. Proves the SWT-bench harness runs on a free runner, exports the
# Verified instance ids, and records runner facts. No API keys needed.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Gold instance to validate"
        default: "sympy__sympy-20590"
        required: true

permissions:
  contents: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SWT_BENCH_REF: be12d4c8e7a5315a6bd60b0cad72736e96a4af3e
      INSTANCE: ${{ inputs.instance_id }}
      BOOTSTRAP_WORK: /tmp/bootstrap
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Record runner and disk before
        run: |
          mkdir -p "$BOOTSTRAP_WORK/results"
          {
            echo "image: $ImageOS $ImageVersion"
            echo "cpus: $(nproc)"
            free -h
            docker version --format 'docker {{.Server.Version}}'
          } > "$BOOTSTRAP_WORK/runner.txt"
          df -h / > "$BOOTSTRAP_WORK/disk_before.txt"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h / > "$BOOTSTRAP_WORK/disk_after_free.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SWT-bench harness
        run: |
          git clone https://github.com/logic-star-ai/swt-bench.git /tmp/swt-bench
          git -C /tmp/swt-bench checkout "$SWT_BENCH_REF"
          pip install -e /tmp/swt-bench datasets

      - name: Export Verified instance ids
        run: python scripts/export_verified_ids.py eval/samples/verified_ids.txt > "$BOOTSTRAP_WORK/dataset.json"

      - name: Validate one gold instance
        working-directory: /tmp/swt-bench
        run: |
          start=$(date +%s)
          set -o pipefail
          python -m src.main \
            --predictions_path gold \
            --max_workers 1 \
            --instance_ids "$INSTANCE" \
            --run_id validate-gold 2>&1 | tee "$BOOTSTRAP_WORK/validate.log"
          echo $(( $(date +%s) - start )) > "$BOOTSTRAP_WORK/validate_seconds"

      - name: Collect results
        if: always()
        run: |
          if [ -d /tmp/swt-bench/evaluation_results ]; then
            cp -r /tmp/swt-bench/evaluation_results/. "$BOOTSTRAP_WORK/results/"
          fi
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' > "$BOOTSTRAP_WORK/images.txt"
          df -h / > "$BOOTSTRAP_WORK/disk_after_run.txt"
          python scripts/write_box_notes.py eval/box-notes.md

      - name: Commit notes and ids
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/box-notes.md
          if [ -f eval/samples/verified_ids.txt ]; then git add eval/samples/verified_ids.txt; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "bootstrap: box notes and Verified ids (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
