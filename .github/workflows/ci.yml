name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPRO_SWT_BENCH: /tmp/swt-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: SWT-bench checkout (constants and log parsers only)
        run: |
          git clone -q https://github.com/logic-star-ai/swt-bench.git "$REPRO_SWT_BENCH"
          git -C "$REPRO_SWT_BENCH" checkout -q be12d4c8e7a5315a6bd60b0cad72736e96a4af3e
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy --strict src
      - name: Workflow lint
        run: actionlint
      - name: Workflow safety check
        run: python scripts/check_workflows.py
      - name: Spec coverage
        run: python scripts/check_spec_coverage.py
      - name: Hermetic tests
        run: pytest -m "not docker and not live_llm"
