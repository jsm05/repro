name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy --strict src
      - name: Workflow lint
        run: actionlint
      - name: Spec coverage
        run: python scripts/check_spec_coverage.py
      - name: Hermetic tests
        run: pytest -m "not docker and not live_llm"
