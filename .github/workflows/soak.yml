name: soak

# Manual. Sends up to N requests to one route within H hours to find hidden daily caps
# and measure latency over a whole night (T3.L2). No request starts after H hours, and
# eval/soak.md is rewritten after every request, so even a cut-off run is committed.

on:
  workflow_dispatch:
    inputs:
      route:
        description: "Route id from config/routes.yaml"
        default: "nvidia/mistral-large-4"
        required: true
      requests:
        description: "Number of requests"
        default: "500"
        required: true
      hours:
        description: "Time limit in hours (max 5)"
        default: "5"
        required: true

permissions:
  contents: write

concurrency:
  group: soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      ROUTE: ${{ inputs.route }}
      REQUESTS: ${{ inputs.requests }}
      HOURS: ${{ inputs.hours }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Soak
        # Below the job limit so the commit step always gets time to run.
        timeout-minutes: 330
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: repro llm soak --route "$ROUTE" --requests "$REQUESTS" --hours "$HOURS" --out eval/soak.md
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f eval/soak.md ]; then
            echo "no report"
            exit 0
          fi
          git add eval/soak.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "soak: report for ${ROUTE} (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
