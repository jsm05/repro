name: live-smoke

# Manual. Uses the free-tier keys.
#   mode smoke:    one small call per enabled route, the model list each key can see, and
#                  a ledger cross-check (T3.L1). Commits eval/live-smoke.md.
#   mode fixtures: the smoke (with the agent-prompt probe), then the agent (A-chain) on the
#                  8 fixtures with LocalSandbox, recording every model reply. Commits eval/cassettes/fixtures-a-chain/ and the run's
#                  report and rows under eval/reports/live/, which the hermetic suite replays.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke or fixtures"
        type: choice
        options: [smoke, fixtures]
        default: smoke

permissions:
  contents: write

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Live tests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pytest -m live_llm tests/live/test_live.py::test_live_smoke
      - name: Smoke report
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: repro llm smoke --out eval/live-smoke.md || true
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/live-smoke.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "live-smoke: report (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  fixtures:
    if: inputs.mode == 'fixtures'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Smoke and agent-prompt probe
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: repro llm smoke --out eval/live-smoke.md || true
      - name: Agent on the fixtures (records cassettes)
        timeout-minutes: 160
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >
          repro eval --config eval/configs/fixtures-a-chain.yaml
          --run-id fixtures-a-chain-live --results-dir runs/live
      - name: Report and rows
        if: always()
        run: |
          mkdir -p eval/reports/live
          repro report --run fixtures-a-chain-live --results-dir runs/live \
            --title "Agent on the fixtures, live free-tier models (A-chain, dev only)" \
            --out eval/reports/live/fixtures-live.md || true
          cp runs/live/fixtures-a-chain-live/shard-1.jsonl eval/reports/live/fixtures-live-rows.jsonl || true
          cp -r runs/live/fixtures-a-chain-live/traces eval/reports/live/traces || true
      - name: Redact keys
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: repro llm redact eval/live-smoke.md eval/cassettes/fixtures-a-chain eval/reports/live
      - name: Commit cassettes and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in eval/live-smoke.md eval/cassettes/fixtures-a-chain eval/reports/live; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "live fixtures: A-chain cassettes and report (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
