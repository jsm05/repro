name: eval

# Benchmark runs in resumable batches (DESIGN 5.9, 5.10). Manual, or nightly at 20:30 UTC
# (02:00 IST) while eval/active_run.yaml exists on main (fields: config, run_id, shards).
# Each shard frees disk, runs `repro eval --shard k/N --deadline-minutes 330
# --stop-when-exhausted`, commits a row per finished unit to the `results` branch, and
# uploads its files as an artifact even on failure. API keys are only in the eval step.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file, e.g. eval/configs/B0-main.yaml"
        required: true
      run_id:
        description: "Run id (results/<run_id>/ on the results branch)"
        required: true
      shards:
        description: "Number of parallel shards"
        default: "6"
        required: true
      ref:
        description: "Git ref of the code to run"
        default: "main"
        required: true
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

concurrency:
  group: eval-${{ inputs.run_id || 'nightly' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.plan.outputs.go }}
      config: ${{ steps.plan.outputs.config }}
      run_id: ${{ steps.plan.outputs.run_id }}
      ref: ${{ steps.plan.outputs.ref }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide what to run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_CONFIG: ${{ inputs.config }}
          IN_RUN_ID: ${{ inputs.run_id }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ ! -f eval/active_run.yaml ]; then
              echo "no eval/active_run.yaml on main: nothing to run tonight"
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CONFIG=$(python -c "import yaml;print(yaml.safe_load(open('eval/active_run.yaml'))['config'])")
            RUN_ID=$(python -c "import yaml;print(yaml.safe_load(open('eval/active_run.yaml'))['run_id'])")
            SHARDS=$(python -c "import yaml;print(yaml.safe_load(open('eval/active_run.yaml')).get('shards', 6))")
            REF=main
          else
            CONFIG="$IN_CONFIG"; RUN_ID="$IN_RUN_ID"; SHARDS="$IN_SHARDS"; REF="$IN_REF"
          fi
          export SHARDS
          MATRIX=$(python -c "import json, os; print(json.dumps(list(range(1, int(os.environ['SHARDS']) + 1))))")
          {
            echo "go=true"
            echo "config=$CONFIG"
            echo "run_id=$RUN_ID"
            echo "shards=$SHARDS"
            echo "ref=$REF"
            echo "matrix=$MATRIX"
          } >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      REPRO_SWT_BENCH: /tmp/swt-bench
      CONFIG: ${{ needs.plan.outputs.config }}
      RUN_ID: ${{ needs.plan.outputs.run_id }}
      SHARDS: ${{ needs.plan.outputs.shards }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Repro and the SWT-bench harness
        run: |
          pip install -e .
          git clone -q https://github.com/logic-star-ai/swt-bench.git "$REPRO_SWT_BENCH"
          git -C "$REPRO_SWT_BENCH" checkout -q be12d4c8e7a5315a6bd60b0cad72736e96a4af3e
          pip install -e "$REPRO_SWT_BENCH"
      - name: Export instance records (sealed; never committed)
        run: python scripts/export_instances.py --config "$CONFIG" --out eval/data/swt_records.jsonl
      - name: Docker Hub login (optional, for pull limits)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin \
              || echo "::warning::Docker Hub login failed (check the DOCKERHUB_* secrets); continuing with anonymous pulls"
          else
            echo "no Docker Hub secrets: anonymous pulls"
          fi
      - name: Eval batch
        timeout-minutes: 340
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESULTS_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        # A split: test config runs with --final, which repro refuses unless this is a
        # clean checkout of an eval-freeze-* tag (T7.3). Dev configs never get it (T7.4).
        run: |
          EXTRA=()
          if python -c "import yaml, os, sys; sys.exit(yaml.safe_load(open(os.environ['CONFIG'])).get('split') != 'test')"; then
            EXTRA+=(--final)
          fi
          repro eval --config "$CONFIG" --run-id "$RUN_ID" \
            --shard "$SHARD/$SHARDS" --deadline-minutes 330 --stop-when-exhausted \
            --results-branch "$RESULTS_REMOTE" --workdir /tmp/results-branch "${EXTRA[@]}"
      - name: Upload shard files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ needs.plan.outputs.run_id }}-shard-${{ matrix.shard }}
          path: /tmp/results-branch/results/
          if-no-files-found: warn
