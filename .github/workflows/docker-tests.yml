name: docker-tests

# Manual (E1). Real-Docker tests (T6.D1 to T6.D9): the sandbox contract suite on
# DockerSandbox, network/memory/PID/privilege checks, .git hardening, the reaper, and
# gold agreement on eval/samples/pilot_10.txt against the official SWT-bench harness.
# No API keys: nothing here calls a model. Commits eval/gold-agreement.md.

on:
  workflow_dispatch:
    inputs:
      gold:
        description: "Also run gold agreement on the pilot (about 2 hours)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: docker-tests
  cancel-in-progress: false

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      REPRO_SWT_BENCH: /tmp/swt-bench
      REPRO_DOCKER_TEST_IMAGE: repro-test-python:3.11
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Repro and the SWT-bench harness
        run: |
          pip install -e ".[dev]"
          git clone -q https://github.com/logic-star-ai/swt-bench.git "$REPRO_SWT_BENCH"
          git -C "$REPRO_SWT_BENCH" checkout -q be12d4c8e7a5315a6bd60b0cad72736e96a4af3e
          pip install -e "$REPRO_SWT_BENCH"
      - name: Build the test image
        run: docker build -t "$REPRO_DOCKER_TEST_IMAGE" tests/docker
      - name: Docker tests (T6.D1 to T6.D7, T6.D9)
        run: pytest -m docker tests/docker -k "not gold" -v
      - name: Export pilot records
        if: inputs.gold
        run: python scripts/export_instances.py --ids-file eval/samples/pilot_10.txt --out /tmp/pilot_records.jsonl
      - name: Gold agreement on the pilot (T6.D8)
        if: inputs.gold
        timeout-minutes: 280
        env:
          REPRO_PILOT_RECORDS: /tmp/pilot_records.jsonl
        run: pytest -m docker tests/docker -k gold -v -s
      - name: Commit the gold agreement report
        if: always() && inputs.gold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in eval/gold-agreement.md eval/gold-agreement.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "docker-tests: gold agreement on the pilot (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
