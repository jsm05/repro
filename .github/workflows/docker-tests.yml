name: docker-tests

# Manual (E1). Real-Docker tests (T6.D1 to T6.D9): the sandbox contract suite on
# DockerSandbox, network/memory/PID/privilege checks, .git hardening and the reaper; then
# gold agreement on a sample against the official SWT-bench harness, one matrix job per
# instance, merged into a report: eval/gold-agreement.md for the pilot, and
# eval/gold-<sample>.md for dev_15 and test_50 (the M7 gold check, no model runs).
# No API keys.

on:
  workflow_dispatch:
    inputs:
      gold:
        description: "Also run gold agreement on the sample below (one job per instance)"
        type: boolean
        default: true
      sample:
        description: "Which sample to gold-check"
        type: choice
        options: [pilot_10, dev_15, test_50]
        default: pilot_10
      only:
        description: "Optional: space-separated ids to rerun (others keep their last result)"
        default: ""

permissions:
  contents: write

concurrency:
  group: docker-tests
  cancel-in-progress: false

env:
  REPRO_SWT_BENCH: /tmp/swt-bench
  REPRO_DOCKER_TEST_IMAGE: repro-test-python:3.11

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build the test image
        run: docker build -t "$REPRO_DOCKER_TEST_IMAGE" tests/docker
      - name: Docker tests (T6.D1 to T6.D7, T6.D9)
        run: pytest -m docker tests/docker -k "not gold" -v

  pilot:
    if: inputs.gold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - name: Pilot ids
        id: ids
        env:
          ONLY: ${{ inputs.only }}
          SAMPLE: ${{ inputs.sample }}
        run: python -c "import json, os; ids = os.environ['ONLY'].split() or open('eval/samples/' + os.environ['SAMPLE'] + '.txt').read().split(); print('ids=' + json.dumps(ids))" >> "$GITHUB_OUTPUT"

  gold:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJson(needs.pilot.outputs.ids) }}
    env:
      INSTANCE: ${{ matrix.instance }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Repro and the SWT-bench harness
        run: |
          pip install -e ".[dev]"
          git clone -q https://github.com/logic-star-ai/swt-bench.git "$REPRO_SWT_BENCH"
          git -C "$REPRO_SWT_BENCH" checkout -q be12d4c8e7a5315a6bd60b0cad72736e96a4af3e
          pip install -e "$REPRO_SWT_BENCH"
      - name: Export this instance's record
        run: |
          echo "$INSTANCE" > /tmp/one.txt
          python scripts/export_instances.py --ids-file /tmp/one.txt --out /tmp/pilot_records.jsonl
      - name: Gold agreement (T6.D8)
        timeout-minutes: 160
        env:
          REPRO_PILOT_RECORDS: /tmp/pilot_records.jsonl
          REPRO_PILOT_ONLY: ${{ matrix.instance }}
          REPRO_GOLD_SAMPLE: ${{ inputs.sample }}
          REPRO_GOLD_OUT: /tmp/gold/gold-${{ matrix.instance }}.md
          REPRO_HARNESS_DEBUG: "1"
        run: pytest -m docker tests/docker -k gold -v -s
      - name: Upload this instance's result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-${{ matrix.instance }}
          path: /tmp/gold/
          if-no-files-found: warn

  report:
    needs: gold
    if: always() && inputs.gold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/gold
      - name: Merge (instances not rerun keep their last committed result)
        env:
          SAMPLE: ${{ inputs.sample }}
        run: |
          if [ "$SAMPLE" = pilot_10 ]; then OUT=eval/gold-agreement; else OUT="eval/gold-$SAMPLE"; fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          if [ -f "$OUT.json" ]; then mkdir -p /tmp/gold/previous && cp "$OUT.json" /tmp/gold/previous/; fi
          python scripts/gold_agreement.py "eval/samples/$SAMPLE.txt" --merge /tmp/gold --out "$OUT.md" || true
      - name: Commit the gold agreement report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT.md" "$OUT.json"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "docker-tests: gold agreement on ${{ inputs.sample }} (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
