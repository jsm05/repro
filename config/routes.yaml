# Free-tier routes for Repro (DESIGN 5.5). Limits are data, not code.
# Re-check before every run: `repro llm smoke` (live-smoke.yml) lists what each key can
# see and calls every enabled route. Never add a route without `free: true` to an eval.
version: 1

providers:
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

routes:
  # Primary (DECISIONS D-E0-3). NVIDIA publishes no limits; about 40 requests/min per
  # account is the community-reported cap, and it is shared by every NVIDIA route.
  - id: nvidia/mistral-large-4
    provider: nvidia
    model: mistralai/mistral-large-4-1t-a52b
    weights: mistral-large-4-1t-a52b
    context_window: 131072   # not published for the free endpoint; 9K-token prompts measured fine
    max_output_tokens: 8192  # reasoning model: reasoning tokens count against this
    reasoning: true
    native_tools: true       # the server's tool parser swallows tool-call replies otherwise (D-M5-13)
    limits: {rpm: 40}
    reset: utc_day
    free: true
    trains_on_data: true     # terms unclear, so assume yes: refused for private code
    verified_on: 2026-11-19
    note: "Probed 2026-11-19: 23/23 ok, 22 s median, 144 s worst."

  - id: nvidia/nemotron-3-ultra
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    weights: nemotron-3-ultra-550b-a55b
    context_window: 131072
    max_output_tokens: 8192
    reasoning: true
    limits: {rpm: 40}
    free: true
    trains_on_data: true
    note: "Listed by the key on 2026-11-19; not called yet."

  - id: nvidia/laguna-xs-2.1
    provider: nvidia
    model: poolside/laguna-xs-2.1
    weights: laguna-xs-2.1
    context_window: 131072
    max_output_tokens: 8192
    limits: {rpm: 40}
    free: true
    trains_on_data: true
    note: "Listed by the key on 2026-11-19; not called yet."

  - id: gemini/flash-lite
    provider: gemini
    model: gemini-3.5-flash-lite
    weights: gemini-3.5-flash-lite
    context_window: 1048576
    max_output_tokens: 8192
    limits: {rpm: 10, tpm: 250000, rpd: 500}
    reset: pacific_day
    free: true
    trains_on_data: true
    note: "Limits from third-party reports; replace with AI Studio's numbers. Model id unverified."

  - id: openrouter/free
    provider: openrouter
    model: "pick-a-current-model:free"
    weights: openrouter-free
    enabled: false
    context_window: 32768
    max_output_tokens: 4096
    limits: {rpm: 20, rpd: 50}
    free: true
    trains_on_data: true
    note: "Disabled until a current :free model is picked from `repro llm smoke` output."

logical_models:
  primary: [nvidia/mistral-large-4]
  nemotron-ultra: [nvidia/nemotron-3-ultra]
  laguna: [nvidia/laguna-xs-2.1]
  gemini-flash-lite: [gemini/flash-lite]
  openrouter-free: [openrouter/free]

chains:
  dev: [primary, gemini-flash-lite, nemotron-ultra, openrouter-free]
